services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  waf:
    profiles: ["waf"]
    build:
      context: ./waf
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: "http://host.docker.internal:3000"
      BACKEND_ORIGIN: "http://host.docker.internal:4000"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_RESP_BODY_ACCESS: "On"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo-data: {}
