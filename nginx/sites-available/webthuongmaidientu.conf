# ============================================================================
# File cấu hình Virtual Host Nginx với HTTPS (Let's Encrypt SSL/TLS)
# Đường dẫn chuẩn trên Ubuntu/Debian:
#   /etc/nginx/sites-available/webthuongmaidientu.conf
# Kích hoạt bằng lệnh:
#   sudo ln -s /etc/nginx/sites-available/webthuongmaidientu.conf /etc/nginx/sites-enabled/
# ============================================================================

# 1. Khối HTTP (Cổng 80): Phục vụ xác thực ACME Challenge của Certbot & Redirect 301 sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webthuongmaidientu.local www.webthuongmaidientu.local;

    # Thư mục phục vụ xác thực quyền sở hữu tên miền của Let's Encrypt Certbot (HTTP-01 Challenge)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Tự động chuyển hướng vĩnh viễn (301 Moved Permanently) mọi truy cập HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Khối HTTPS (Cổng 443): Mã hóa SSL/TLS & Reverse Proxy cho Frontend (:3000) và Backend (:4000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webthuongmaidientu.local www.webthuongmaidientu.local;

    # Đường dẫn chứng chỉ số Let's Encrypt do Certbot cấp phát
    ssl_certificate /etc/letsencrypt/live/webthuongmaidientu.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webthuongmaidientu.local/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/webthuongmaidientu.local/chain.pem;

    # Cấu hình giao thức TLS hiện đại (Đạt chuẩn A+ trên Qualys SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Tối ưu phiên SSL (Session Resumption)
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Bảo mật HTTP Headers (HSTS, Chống Clickjacking, Chống MIME-Sniffing)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn kích thước upload ảnh sản phẩm (2MB)
    client_max_body_size 5M;

    # Reverse Proxy cho các request API (/api/*) vào Backend Express (Cổng 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Reverse Proxy cho giao diện người dùng (/) vào Frontend Next.js (Cổng 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
