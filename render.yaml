services:
  - type: web
    name: webthuongmaidientu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SHIPPING_FEE
        value: "30000"
      - key: MONGODB_URI
        sync: false
      - key: BANK_NAME
        value: Vietcombank
      - key: BANK_CODE
        value: VCB
      - key: BANK_ACCOUNT
        sync: false
      - key: BANK_HOLDER
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: SEPAY_USER_API_TOKEN
        sync: false
      - key: PAYMENT_RESERVATION_MINUTES
        value: "15"

  - type: web
    name: webthuongmaidientu-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://webthuongmaidientu-api.onrender.com

  - type: web
    name: webthuongmaidientu-waf
    runtime: docker
    plan: free
    rootDir: waf
    dockerfilePath: ./Dockerfile
    healthCheckPath: /waf-health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://webthuongmaidientu-web.onrender.com
      - key: BACKEND_ORIGIN
        value: https://webthuongmaidientu-api.onrender.com
      - key: PARANOIA
        value: "1"
      - key: BLOCKING_PARANOIA
        value: "1"
      - key: MODSEC_RULE_ENGINE
        value: "On"
      - key: MODSEC_RESP_BODY_ACCESS
        value: "On"
