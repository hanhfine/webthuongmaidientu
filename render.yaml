services:
  - type: web
    name: webthuongmaidientu-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SHIPPING_FEE
        value: "30000"
      - key: MONGODB_URI
        sync: false

  - type: web
    name: webthuongmaidientu-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
