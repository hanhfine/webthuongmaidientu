# ============================================================================
# Custom ModSecurity v3 Rules (BEFORE OWASP CRS)
# 1. Fake Hidden Form Fields (Honeypot) to trap automated order/card bots
# 2. Automated Security Scanner Blocking
# 3. Targeted Exclusions for legitimate SePay Webhooks, Image Uploads & SSE
# ============================================================================

# Ensure JSON request bodies are parsed into ARGS so Honeypot & CRS rules inspect JSON payloads
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:100090,\
    phase:1,\
    pass,\
    nolog,\
    ctl:requestBodyProcessor=JSON"

# [HONEYPOT 1] Trap bots filling fake hidden form fields in URL-encoded or JSON bodies
SecRule ARGS:website_url|ARGS:hp_company|ARGS:cc_promo_verify "!@rx ^$" \
    "id:100100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Bot Trap: Fake hidden form field (Honeypot) was populated',\
    logdata:'Triggered honeypot arg: %{MATCHED_VAR_NAME}',\
    tag:'CUSTOM/HONEYPOT/BOT',\
    severity:'CRITICAL'"

# [HONEYPOT 2] Catch raw JSON honeypot fields even if Content-Type was manipulated
SecRule REQUEST_BODY "@rx \"(?:website_url|hp_company|cc_promo_verify)\"\s*:\s*\"[^\"]+\"" \
    "id:100101,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Bot Trap: Fake hidden JSON field (Honeypot) populated',\
    tag:'CUSTOM/HONEYPOT/BOT',\
    severity:'CRITICAL'"

# [SCANNER] Block known automated vulnerability scanners immediately
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:sqlmap|nikto|nmap|gobuster|dirbuster|wpscan|nuclei|acunetix|masscan|hydra|zgrab|ffuf|wfuzz|nessus|openvas|arachni)" \
    "id:100110,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Automated Security Scanner Detected and Blocked',\
    logdata:'Scanner UA: %{MATCHED_VAR}',\
    tag:'CUSTOM/SCANNER/AUTOMATION',\
    severity:'CRITICAL'"

# [EXCLUSION 1] SePay Bank Webhook: allow bank transfer text without SQLi/XSS false positives
# (Endpoint is strictly authenticated via Authorization: Apikey + timingSafeEqual in Express)
SecRule REQUEST_URI "@beginsWith /api/webhooks/" \
    "id:100120,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=941100"

# [EXCLUSION 2] Product image binary uploads (multipart/form-data)
SecRule REQUEST_URI "@beginsWith /api/images" \
    "id:100121,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920420,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=941100"

# [EXCLUSION 3] Disable response buffering on real-time SSE streams
SecRule REQUEST_URI "@rx ^/api/orders/[0-9a-fA-F]{24}/events" \
    "id:100122,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"
