# ============================================================================
# Custom ModSecurity v3 Rules (AFTER OWASP CRS — Phase 4 Response Body DLP)
# 1. Credit Card Number Leakage Detection using @verifyCC (Luhn checksum)
# 2. Sensitive Credential / Connection String Leakage Detection
# ============================================================================

# [DLP 1] Credit Card Leakage Detection via ModSecurity @verifyCC operator (Luhn algorithm)
SecRule RESPONSE_BODY "@verifyCC (?:\d[ -]*?){13,16}" \
    "id:100200,\
    phase:4,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Data Loss Prevention: Credit Card Number Leakage Detected via @verifyCC (Luhn)',\
    logdata:'Blocked outgoing response containing valid Luhn PAN',\
    tag:'OWASP_CRS/LEAKAGE/CREDIT_CARD',\
    tag:'CUSTOM/DLP',\
    severity:'CRITICAL'"

# [DLP 2] Prevent accidental leakage of database credentials, private keys, or webhook secrets
SecRule RESPONSE_BODY "@rx (?i)(?:mongodb\+srv://[^\s\"']+|-----BEGIN\s+(?:RSA\s+|EC\s+)?PRIVATE\s+KEY-----|SEPAY_WEBHOOK_API_KEY\s*=|JWT_SECRET\s*=)" \
    "id:100201,\
    phase:4,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Data Loss Prevention: Sensitive Server Secret Leakage Detected',\
    tag:'OWASP_CRS/LEAKAGE/SECRET',\
    tag:'CUSTOM/DLP',\
    severity:'CRITICAL'"
